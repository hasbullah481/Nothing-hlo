<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GemSite AI Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <h1>GemSite AI Builder</h1>
        <p class="muted">
          Describe the website you want. Each question costs <strong>100 gems</strong>.
          You receive <strong>500 gems per day</strong>.
        </p>

        <div class="wallet" id="wallet" aria-live="polite"></div>

        <label for="prompt">What do you want to build?</label>
        <textarea
          id="prompt"
          rows="6"
          placeholder="Example: A modern bakery site with a hero section, menu highlights, and contact form"
        ></textarea>

        <button id="buildButton" type="button">Generate website (100 gems)</button>
        <p class="error" id="error" aria-live="polite"></p>
      </section>

      <section class="panel output">
        <h2>Generated Website Preview</h2>
        <iframe id="preview" title="Generated website preview"></iframe>

        <h3>Generated HTML</h3>
        <pre id="codeOutput"></pre>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
